<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --green:#6e6d3d; --green-l:#9a9a5c; --green-d:#3f3f23;
    --cream:#f4ebdd; --cream-d:#d7d1b7; --muted:#a7a488; --gold:#cdb98c;
    --card:rgba(255,255,255,.055); --bd:rgba(244,235,221,.14);
    --ink:#2b2b1a;
  }
  html,body{height:100%}
  body{font-family:'Jost',system-ui,-apple-system,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden;
    background:#1b1b12;
    background-image:radial-gradient(1100px circle at 50% -8%, #55542f 0%, #34341e 44%, #1b1b12 100%);
    background-attachment:fixed}
  .fr{font-family:'Fraunces',Georgia,serif}

  #bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--green-l),var(--gold));z-index:50;transition:width .4s ease;box-shadow:0 0 12px rgba(205,185,140,.5)}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .36s ease,transform .36s ease;overflow-y:auto}
  .screen.active{opacity:1;visibility:visible;transform:none}
  .wrap{width:100%;max-width:560px;margin:auto}

  /* medalhão + nome */
  .medal{width:116px;height:116px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 30%, #7a7a46 0%, #4c4c2b 60%, #343420 100%);
    box-shadow:0 10px 34px rgba(0,0,0,.4), inset 0 0 0 1px rgba(244,235,221,.18), 0 0 0 7px rgba(244,235,221,.05)}
  .medal img{width:58%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .brand-name{font-size:clamp(1.9rem,6.6vw,2.5rem);font-weight:500;text-align:center;line-height:1.05;color:var(--cream)}
  .brand-sub{text-align:center;font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:400}

  /* 3 passos */
  .steps{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:26px auto 4px;max-width:440px}
  .step{flex:1;text-align:center}
  .step .ic{width:58px;height:58px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    background:radial-gradient(circle at 40% 32%, #6f6f41 0%, #45452800 70%), rgba(255,255,255,.06);border:1px solid var(--bd)}
  .step .st{font-weight:600;font-size:.92rem;color:var(--cream)}
  .step .sd{font-size:.76rem;color:var(--muted);line-height:1.25;margin-top:2px}
  .step-arrow{align-self:center;color:var(--muted);font-size:1.2rem;padding-top:14px;flex:0 0 auto}

  .pbar{display:flex;align-items:center;gap:12px;max-width:440px;margin:18px auto 0}
  .pbar .track{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .pbar .fill{height:100%;width:4%;border-radius:999px;background:linear-gradient(90deg,var(--green-l),var(--gold));transition:width .4s ease}
  .pbar .lbl{font-size:.82rem;color:var(--cream-d);font-weight:600;white-space:nowrap}

  /* cabeçalho compacto nas perguntas */
  .mini{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 auto 16px}
  .mini-badge{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 30%, #7a7a46 0%, #4c4c2b 60%, #343420 100%);
    border:1px solid rgba(244,235,221,.16);box-shadow:0 4px 14px rgba(0,0,0,.3), 0 0 0 5px rgba(244,235,221,.04)}
  .mini-badge img{width:58%}
  .mini-name{font-family:'Fraunces',Georgia,serif;font-size:1.08rem;color:var(--cream);font-weight:500;line-height:1.05}
  .mini-sub{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:400}
  .hello{text-align:center;font-size:.95rem;color:var(--gold);margin:-6px 0 14px;font-weight:600}

  /* cartão */
  .card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;margin-top:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .card-intro{text-align:center}
  .card-intro h2{font-size:clamp(1.7rem,5.6vw,2.1rem);font-weight:500;color:var(--cream);margin-bottom:8px}
  .card-intro p{color:var(--cream-d);line-height:1.55;font-size:1rem;max-width:400px;margin:0 auto}

  .q-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .q-top .opt-tag{font-size:.8rem;color:var(--gold);font-weight:600;letter-spacing:.02em;background:rgba(205,185,140,.14);border:1px solid rgba(205,185,140,.26);border-radius:8px;padding:3px 11px}
  .q-top .opt-tag.op{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--bd)}
  .q-title{font-size:clamp(1.45rem,5vw,1.9rem);font-weight:500;color:var(--cream);line-height:1.22;margin-bottom:8px}
  .q-desc{color:var(--muted);font-size:.95rem;line-height:1.5;margin-bottom:18px}
  .q-body{margin-top:6px}

  .inp{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);border-radius:14px;padding:15px 16px;font-family:inherit;font-size:1.15rem;color:var(--cream)}
  .inp::placeholder{color:#8f8c72}
  .inp:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.06)}
  textarea.inp{min-height:120px;resize:vertical;font-size:1.05rem;line-height:1.5}
  input[type=date].inp{color-scheme:dark}

  /* endereço em um card */
  .addr{display:flex;flex-direction:column;gap:13px}
  .addr-hint{font-size:.92rem;color:var(--gold);margin:-2px 0 4px;display:flex;align-items:center;gap:6px}
  .addr-row{display:flex;gap:11px}
  .fld label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.01em}
  .fld .inp{font-size:1.05rem;padding:13px 14px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.045);border:1.5px solid var(--bd);border-radius:15px;padding:14px 15px;cursor:pointer;transition:border-color .14s,background .14s,transform .08s;font-size:1.02rem;color:var(--cream);text-align:left}
  .opt:hover{border-color:rgba(205,185,140,.5);background:rgba(255,255,255,.07)}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--gold);background:rgba(205,185,140,.15)}
  .opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:var(--gold);background:rgba(0,0,0,.15)}
  .opt.sel .k{background:var(--gold);color:#2b2b1a;border-color:var(--gold)}
  .opt.multi .k{border-radius:7px}
  /* opção grande (ciente) */
  .opt-big{justify-content:center;text-align:center;padding:22px;font-size:1.22rem;font-weight:600;background:rgba(205,185,140,.12);border-color:rgba(205,185,140,.45);box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .opt-big span{color:var(--gold);letter-spacing:.01em}
  .opt-big.sel{background:rgba(205,185,140,.26);border-color:var(--gold)}
  .opt-big.sel span{color:var(--cream)}
  .outro-wrap{margin-top:3px}
  .outro-wrap input{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:1rem;color:var(--cream)}
  .outro-wrap input::placeholder{color:#8f8c72}
  .outro-wrap input:focus{outline:none;border-color:var(--gold)}

  .nav{display:flex;align-items:center;gap:12px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#9a9a5c 0%,#6e6d3d 52%,#4c4c2a 100%);color:#fff;border:none;border-radius:999px;padding:15px 32px;font-family:inherit;font-weight:600;font-size:1.04rem;cursor:pointer;transition:filter .14s,transform .14s,box-shadow .14s;box-shadow:0 8px 22px rgba(0,0,0,.32)}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
  .btn-lg{width:100%;padding:17px;font-size:1.1rem;margin-top:22px}
  .btn-ghost{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:500;font-size:.95rem;cursor:pointer;padding:8px 10px}
  .btn-ghost:hover{color:var(--gold)}
  .btn-outline{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);color:var(--cream);border-radius:999px;padding:15px;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer}
  .btn-outline:hover{border-color:var(--gold)}
  .back{position:fixed;left:14px;bottom:16px;z-index:40}
  .err{color:#e6a98f;font-size:.9rem;margin-top:10px;min-height:1.1em;font-weight:500}
  .foot-note{text-align:center;color:var(--muted);font-size:.84rem;margin-top:18px}

  .done-check{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 40% 32%, #7a7a46, #45452a);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2.1rem;box-shadow:0 0 0 7px rgba(244,235,221,.05)}
  .acts{display:flex;flex-direction:column;gap:11px;margin-top:22px}

  /* confirmação */
  .review{margin:10px 0 2px;border-top:1px solid var(--bd);max-height:48vh;overflow-y:auto}
  .rev-item{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid var(--bd)}
  .rev-main{flex:1;min-width:0}
  .rev-q{font-size:.8rem;color:var(--muted);line-height:1.3}
  .rev-a{font-size:1rem;color:var(--cream);margin-top:3px;line-height:1.35;overflow-wrap:break-word}
  .rev-edit{flex:0 0 auto;background:none;border:none;color:var(--gold);font-family:inherit;font-weight:600;font-size:.84rem;cursor:pointer;padding:4px 2px;text-decoration:underline}

  /* anexos */
  .filewrap{display:flex;flex-direction:column;gap:11px}
  .filebtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.05);border:1.5px dashed var(--bd);border-radius:14px;padding:20px;color:var(--cream);font-weight:600;cursor:pointer;transition:border-color .14s,color .14s}
  .filebtn:hover{border-color:var(--gold);color:var(--gold)}
  .filelist{display:flex;flex-direction:column;gap:7px}
  .fileitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:11px;padding:10px 13px;font-size:.95rem;color:var(--cream)}
  .fileitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filedel{flex:0 0 auto;background:none;border:none;color:var(--muted);font-family:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline}
  .filedel:hover{color:#e6a98f}

  .leaf-pop{position:fixed;z-index:95;font-size:1.6rem;pointer-events:none;transform:translate(-50%,-50%);animation:leafUp 1.05s cubic-bezier(.3,.7,.4,1) forwards;will-change:transform,opacity}
  @keyframes leafUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-180px) scale(1.15) rotate(20deg)}}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b2b1a;border:1px solid var(--bd);color:var(--cream);padding:12px 20px;border-radius:999px;font-weight:500;font-size:.95rem;opacity:0;transition:opacity .25s,transform .25s;z-index:80;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* ajuda de envio (desktop) */
  #helpOv{position:fixed;inset:0;background:rgba(12,12,8,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:120;padding:22px}
  .help-card{background:#262619;border:1px solid var(--bd);border-radius:22px;padding:26px 22px;max-width:390px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.55)}
  .help-ic{font-size:2.3rem;margin-bottom:6px}
  .help-card h3{font-size:1.55rem;color:var(--cream);font-weight:500;margin-bottom:8px}
  .help-card p{color:var(--cream-d);font-size:.96rem;line-height:1.5}
  .help-card ol{text-align:left;color:var(--cream-d);font-size:.97rem;line-height:1.5;margin:14px 0 2px;padding-left:20px}
  .help-card ol li{margin-bottom:8px}
  .help-card b{color:var(--cream)}
  @media (max-width:430px){ .step .sd{font-size:.72rem} .steps{gap:0} .medal{width:104px;height:104px} }
</style>
</head>

function maskCPF(v){ v=v.replace(/\D/g,'').slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})/,'$1.$2.$3-$4'); }
function maskCEP(v){ v=v.replace(/\D/g,'').slice(0,8); return v.length>5? v.slice(0,5)+'-'+v.slice(5): v; }
function maskFone(v){ var d=v.replace(/\D/g,'').slice(0,11); if(d.length<=2) return d; if(d.length<=6) return '('+d.slice(0,2)+') '+d.slice(2); if(d.length<=10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6); return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7); }
function maskData(v){ v=v.replace(/\D/g,'').slice(0,8); if(v.length>4) return v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4); if(v.length>2) return v.slice(0,2)+'/'+v.slice(2); return v; }
function maskNum(v){ return v.replace(/\D/g,''); }
function applyMask(m,v){ return m==='cpf'?maskCPF(v): m==='cep'?maskCEP(v): m==='fone'?maskFone(v): m==='data'?maskData(v): m==='num'?maskNum(v): v; }

function cpfValido(v){ v=(v||'').replace(/\D/g,''); if(v.length!==11||/^(\d)\1{10}$/.test(v)) return false; var s=0,r,i; for(i=0;i<9;i++)s+=parseInt(v[i],10)*(10-i); r=(s*10)%11; if(r===10)r=0; if(r!==parseInt(v[9],10))return false; s=0; for(i=0;i<10;i++)s+=parseInt(v[i],10)*(11-i); r=(s*10)%11; if(r===10)r=0; return r===parseInt(v[10],10); }
function dataValida(v){ var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v||''); if(!m) return false; var d=+m[1],mo=+m[2],y=+m[3]; if(mo<1||mo>12||d<1||d>31||y<1900) return false; var dt=new Date(y,mo-1,d); if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return false; var now=new Date(); if(dt>now) return false; var age=(now-dt)/(365.25*24*3600*1000); return age<=120; }
function idadeCalc(){ var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(ans.nascimento||''); if(!m) return ''; var dt=new Date(+m[3],+m[2]-1,+m[1]); if(isNaN(dt.getTime())) return ''; var now=new Date(); var a=now.getFullYear()-dt.getFullYear(); var mm=now.getMonth()-dt.getMonth(); if(mm<0||(mm===0&&now.getDate()<dt.getDate()))a--; return (a>=0&&a<150)?(a+' anos'):''; }

function salvar(){ try{ var d={ans:{},idx:idx}; Object.keys(ans).forEach(function(k){ if(k==='anexos') return; var v=ans[k]; if(v===null||v===undefined) return; if(typeof v==='object'&&!Array.isArray(v)) return; d.ans[k]=v; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }
function carregar(){ try{ var r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function limparSalvo(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

function buscaCEP(cep){
  var d=(cep||'').replace(/\D/g,''); if(d.length!==8) return;
  fetch('https://viacep.com.br/ws/'+d+'/json/').then(function(r){return r.json();}).then(function(j){
    if(!j||j.erro){ toast('CEP não encontrado, pode preencher à mão 🌿'); return; }
    if(j.logradouro){ ans.rua=j.logradouro; var e=document.getElementById('e_rua'); if(e&&!e.value) e.value=j.logradouro; }
    if(j.bairro){ ans.bairro=j.bairro; var e2=document.getElementById('e_bairro'); if(e2&&!e2.value) e2.value=j.bairro; }
    var cid=(j.localidade||'')+(j.uf?(' - '+j.uf):''); if(cid.trim()){ ans.cidade=cid; var e3=document.getElementById('e_cidade'); if(e3) e3.value=cid; }
    toast('Prontinho, só falta o número 🌿');
    var n=document.getElementById('e_num'); if(n) n.focus();
  }).catch(function(){ toast('Não consegui buscar o CEP, pode preencher à mão 🌿'); });
}

  }

    miniHeaderHTML()+ helloHTML()+
    '<div class="pbar"><div class="track"><div class="fill" style="width:'+(((idx+1)/(Q.length+1))*100)+'%"></div></div><div class="lbl">'+esc(secFor(q.id)||'Quase lá')+'</div></div>'+
    '<div class="card">'+
      '<div class="q-top"><span class="opt-tag'+(q.req?'':' op')+'">'+(q.req?'🌿 obrigatória':'opcional, pode pular')+'</span></div>'+
      '<h2 class="q-title fr">'+esc(q.t)+'</h2>'+

      '<div class="q-body">'+body+'</div>'+

    inp.addEventListener('input', function(e){ var v=e.target.value; if(q.mask) v=applyMask(q.mask,v); e.target.value=v; ans[q.id]=v; document.getElementById('err').textContent=''; });
    if(q.type!=='textarea'){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); next(); } }); }
    setTimeout(function(){ inp.focus(); }, 360);
  }
  document.getElementById('nextBtn').addEventListener('click', next);
  var sk=document.getElementById('skipBtn'); if(sk) sk.addEventListener('click', goNext);
}

function valid(q){
  var v=ans[q.id];
  if(q.descIf && v===q.descIf){ var dd=ans[q.id+'_desc']; if(!(dd&&dd.trim())) return false; }
  if(q.type==='file') return true;
  if(q.type==='endereco'){ return !!(ans.cep&&ans.cep.replace(/\D/g,'').length>=8 && ans.rua&&ans.rua.trim() && ans.numero&&String(ans.numero).trim() && ans.bairro&&ans.bairro.trim() && ans.cidade&&ans.cidade.trim()); }
  if(q.id==='cpf') return cpfValido(v);
  if(q.id==='nascimento') return dataValida(v);
  if(!q.req) return true;
  if(q.type==='checkbox') return Array.isArray(v)&&v.length>0;
  if(q.type==='email') return v&&/.+@.+\..+/.test(v);
  return v&&String(v).trim().length>0;
}
function next(){ var q=Q[idx]; if(!valid(q)){
    var msg='Essa pergunta é obrigatória 🌿';
    if(q.type==='email'&&ans[q.id]) msg='Confira o e-mail, por favor.';
    else if(q.id==='cpf') msg='Esse CPF não parece válido, confere pra mim? 🌿';
    else if(q.id==='nascimento') msg='Confere a data de nascimento, por favor (DD/MM/AAAA) 🌿';
    else if(q.type==='endereco') msg='Preencha CEP, rua, número, bairro e cidade 🌿';
    else if(q.descIf&&ans[q.id]===q.descIf) msg='Conta um pouquinho pra gente, por favor 🌿';
    document.getElementById('err').textContent=msg; return; } goNext(); }
function goNext(){ if(editing){ editing=false; showConfirm(); return; } if(idx>=Q.length-1){ showConfirm(); return; } idx++; renderQ(); }
backBtn.addEventListener('click', function(){
  if(editing){ editing=false; showConfirm(); return; }
  if(view==='end'){ showConfirm(); return; }
  if(view==='confirm'){ idx=Q.length-1; renderQ(); return; }
  if(idx<=0){ showCover(); return; }
  idx--; renderQ();
});

function enderecoTexto(){
  var partes=[ans.rua, (ans.numero?('nº '+ans.numero):''), ans.complemento, ans.bairro, ans.cidade, (ans.cep?('CEP '+ans.cep):'')];
  partes=partes.filter(function(x){return x&&String(x).trim();});
  return partes.length?partes.join(', '):'—';
}
function respostaTexto(q){
  if(q.type==='endereco') return enderecoTexto();
  if(q.type==='file') return anexos.length? anexos.map(function(f){return f.name;}).join(', ') : '—';
  var v=ans[q.id];
  if(q.type==='checkbox'){ var arr=Array.isArray(v)?v.slice():[]; if(q.outro&&arr.indexOf('Outro')>=0&&ans[q.id+'_outro']){ arr=arr.map(function(x){return x==='Outro'?('Outro: '+ans[q.id+'_outro']):x;}); } return arr.length?arr.join(', '):'—'; }
  if(q.type==='radio'&&q.outro&&v==='Outro'&&ans[q.id+'_outro']) return 'Outro: '+ans[q.id+'_outro'];
  if(q.type==='radio'&&q.descIf&&v===q.descIf&&ans[q.id+'_desc']) return v+': '+ans[q.id+'_desc'];
  return (v==null||String(v).trim()==='')?'—':String(v);
}
function nomeArquivo(){ var n=(ans['nome']||'Paciente').trim().replace(/\s+/g,' ').replace(/[\\/:*?"<>|]/g,''); return (n||'Paciente')+'.pdf'; }
function registrar(){ if(!REGISTRO_ENDPOINT) return; try{ var data={}; Q.forEach(function(q){ if(q.type==='file') return; data[q.t]=respostaTexto(q); }); data['_subject']='Novo formulário - '+(ans.nome||'paciente'); fetch(REGISTRO_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data)}).catch(function(){}); }catch(e){} }
function corpoEmail(){ var L=['Formulário "Conte-me sobre você" - Dra. Yasmin de Almeida','']; Q.forEach(function(q){ if(q.type==='file') return; L.push(q.t); L.push(respostaTexto(q)); L.push(''); }); return L.join('\n'); }
function enviarEmail(){ var s='Formulário - '+(ans.nome||'paciente'); location.href='mailto:'+EMAIL_CLINICA+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(corpoEmail()); toast('Abrindo seu e-mail ✉️'); }

function gerarPDF(){
  var JS=window.jspdf.jsPDF, doc=new JS({unit:'pt',format:'a4'});
  var W=595.28, Hp=841.89, M=52;
  var olive=[0x6e,0x6d,0x3d], ink=[0x3c,0x3c,0x26], mut=[0x8a,0x87,0x6e], line=[0xe3,0xdd,0xc9];
  var HEAD=76, FOOT=52;
  function header(){
    doc.setFillColor(olive[0],olive[1],olive[2]); doc.rect(0,0,W,HEAD,'F');
    try{ doc.addImage(LOGO_CREAM,'PNG',M,25,134,134*0.196); }catch(e){}
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.text('Conte-me sobre você', W-M, 36, {align:'right'});
    doc.setTextColor(238,232,214); doc.setFontSize(8); doc.text('Anamnese · Dra. Yasmin de Almeida', W-M, 51, {align:'right'});
  }
  header();
  var y=HEAD+36;
  doc.setTextColor(olive[0],olive[1],olive[2]); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('Respostas do paciente', M, y); y+=18;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(mut[0],mut[1],mut[2]);
  var h=new Date(), ds=('0'+h.getDate()).slice(-2)+'/'+('0'+(h.getMonth()+1)).slice(-2)+'/'+h.getFullYear();
  doc.text('Preenchido em '+ds, M, y); y+=20;
  // resumo em destaque
  var nmP=(ans.nome||'—'), idP=(idadeCalc()||'—');
  var queixa=respostaTexto(qById('motivacao')); if(!queixa||queixa==='—') queixa=(ans.objetivos||'—');
  var qLines=doc.splitTextToSize('Queixa principal: '+queixa, W-2*M-28);
  var boxH=32 + qLines.length*12 + 10;
  doc.setFillColor(0xf5,0xf1,0xe6); doc.roundedRect(M, y, W-2*M, boxH, 9, 9, 'F');
  doc.setFillColor(olive[0],olive[1],olive[2]); doc.roundedRect(M, y, 4, boxH, 2, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(olive[0],olive[1],olive[2]);
  doc.text('Paciente: '+nmP, M+16, y+21);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(ink[0],ink[1],ink[2]);
  doc.text('Idade: '+idP, W-M-16, y+21, {align:'right'});
  doc.setFontSize(10); doc.setTextColor(ink[0],ink[1],ink[2]); doc.text(qLines, M+16, y+38);
  y+=boxH+20;
  Q.forEach(function(q){
    var r=respostaTexto(q);
    var qL=doc.splitTextToSize(q.t, W-2*M-6), aL=doc.splitTextToSize(r, W-2*M-6);
    var bh=qL.length*13 + aL.length*14 + 22;
    if(y+bh > Hp-FOOT){ doc.addPage(); header(); y=HEAD+36; }
    doc.setFillColor(olive[0],olive[1],olive[2]); doc.rect(M-14, y-9, 3, Math.max(11,qL.length*13), 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(olive[0],olive[1],olive[2]);
    doc.text(qL, M, y); y+=qL.length*13+3;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text(aL, M, y); y+=aL.length*14+11;
    doc.setDrawColor(line[0],line[1],line[2]); doc.setLineWidth(.5); doc.line(M,y-6,W-M,y-6); y+=9;
  });
  var pg=doc.internal.getNumberOfPages();
  for(var i=1;i<=pg;i++){ doc.setPage(i);
    doc.setDrawColor(line[0],line[1],line[2]); doc.setLineWidth(.5); doc.line(M, Hp-FOOT+6, W-M, Hp-FOOT+6);
    doc.setFontSize(7.5); doc.setTextColor(mut[0],mut[1],mut[2]);
    doc.text('Contato: (21) 98771-3101 · @dra.yasminalmeida · contato@drayasmindealmeida.com', M, Hp-26);
    doc.text('Página '+i+' de '+pg, W-M, Hp-26, {align:'right'});
  }
  return doc.output('blob');
}
function dlBlob(blob,fn){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(a.href);},4000); }

function abrirAjuda(fn){
  var ov=document.createElement('div'); ov.id='helpOv';
  ov.innerHTML='<div class="help-card">'+
    '<div class="help-ic">📎</div>'+
    '<h3 class="fr">PDF baixado!</h3>'+
    '<p>No computador o WhatsApp não anexa arquivo por link. É rapidinho:</p>'+
    '<ol><li>Vamos abrir a conversa da clínica no WhatsApp.</li>'+
    '<li>Clique no <b>clipe 📎</b> e anexe o arquivo <b>'+esc(fn)+'</b> que acabou de baixar.</li>'+
    '<li>É só enviar. 💚</li></ol>'+
    '<button class="btn btn-lg" id="hWa">Abrir o WhatsApp da clínica</button>'+
    '<button class="btn-ghost" id="hClose" style="margin-top:6px">Fechar</button>'+
  '</div>';
  document.body.appendChild(ov);
  document.getElementById('hWa').addEventListener('click', function(){ window.open('https://wa.me/'+WA_CLINICA+'?text='+encodeURIComponent('Olá! Preenchi o formulário "Conte-me sobre você" e vou anexar o PDF com as minhas respostas. 🌿'),'_blank'); });
  document.getElementById('hClose').addEventListener('click', function(){ ov.remove(); });
}

async function enviar(){
  if(!window.jspdf){ toast('Gerador indisponível (verifique a internet).'); return; }
  var blob=gerarPDF(), fn=nomeArquivo();
  registrar();
  var pdfFile=new File([blob],fn,{type:'application/pdf'});
  var comAnexos=[pdfFile].concat(anexos||[]);
  if(navigator.canShare && navigator.canShare({files:comAnexos})){
    try{ await navigator.share({files:comAnexos, title:'Conte-me sobre você'}); enviado=true; limparSalvo(); toast('Agora é só escolher o WhatsApp 🌿'); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  if(navigator.canShare && navigator.canShare({files:[pdfFile]})){
    try{ await navigator.share({files:[pdfFile], title:'Conte-me sobre você'}); enviado=true; limparSalvo(); toast('Agora é só escolher o WhatsApp 🌿'); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  dlBlob(blob,fn); enviado=true; limparSalvo();
  abrirAjuda(fn);
}
